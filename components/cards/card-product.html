<!-- Component: Product Card -->
<!-- Usage: Inside a u-grid-3 or u-grid-4 section for product listings -->
<!-- Interactive: hover lifts the card -->
<div class="card_product u-flex-vertical u-gap-3">
    <!-- Image -->
    <div class="card_product_image_wrap gc-cloud-card u-overflow-hidden u-position-relative">
        <img src="../../src/assets/product-toothbrush.jpg" alt="Gummy Clouds Kids Toothbrush — Bubblegum Pink" class="c-image c-image-cover card_product_image" loading="lazy" width="400" height="400">
        <!-- Optional badge -->
        <div class="card_product_badge gc-badge u-bg-accent u-position-absolute">
            <span class="c-paragraph u-text-style-small gc-badge_text">New</span>
        </div>
    </div>

    <!-- Info -->
    <div class="card_product_info u-flex-vertical u-gap-1">
        <h3 class="c-heading" data-style="h5">Kids Toothbrush</h3>
        <p class="c-paragraph u-text-style-small card_product_flavor">Bubblegum Pink</p>
        <div class="card_product_price_row u-flex-horizontal u-justify-between u-align-items-center">
            <p class="c-paragraph u-text-style-main card_product_price">$8.99</p>
            <a href="/products/toothbrush" class="c-button-accent card_product_add">Add to Cart</a>
        </div>
    </div>
</div>

<!-- Component: Testimonial Card -->
<!-- Usage: Inside a u-grid-3 or u-grid-2 section for parent reviews -->
<!-- Theme-aware: works on light, dark, or clouds backgrounds -->
<div class="card_testimonial gc-cloud-card u-flex-vertical u-gap-4">
    <!-- Stars (brand illustration) -->
    <img src="../assets/illust-stars-yellow.svg" alt="5 stars" class="card_testimonial_stars" width="80" height="56" loading="lazy">

    <!-- Quote -->
    <blockquote class="card_testimonial_quote">
        <p class="c-paragraph u-text-style-main">"My daughter used to fight me every night at brushing time. Since we switched to Gummy Clouds, she actually asks to brush her teeth!"</p>
    </blockquote>

    <!-- Author -->
    <div class="card_testimonial_author u-flex-horizontal u-gap-3 u-align-items-center">
        <img src="../assets/avatar-placeholder.jpg" alt="Sarah M." class="card_testimonial_avatar" loading="lazy" width="48" height="48">
        <div class="card_testimonial_author_info u-flex-vertical">
            <p class="c-paragraph u-text-style-main card_testimonial_name">Sarah M.</p>
            <p class="c-paragraph u-text-style-small card_testimonial_role">Mom of 2</p>
        </div>
    </div>
</div>

<!-- Component: CTA Banner -->
<!-- Usage: Full-width call-to-action section, typically before footer -->
<!-- Theme: Brand (pink bg) for maximum visual impact -->
<section class="cta_banner u-section u-padding-top-main u-padding-bottom-main u-theme-brand u-overflow-hidden u-position-relative">
    <div class="u-container u-flex-vertical u-gap-5 u-align-items-center u-text-align-center">

        <!-- Eyebrow -->
        <div class="gc-badge cta_badge">
            <span class="c-paragraph u-text-style-small gc-badge_text">Start today</span>
        </div>

        <!-- Heading -->
        <h2 class="c-heading c-heading-display" data-style="h2">Ready to make brushing fun?</h2>

        <!-- Description -->
        <p class="c-paragraph u-text-style-large cta_banner_description">Join thousands of families who turned dental care into a joyful daily ritual. Free shipping on your first order.</p>

        <!-- Buttons -->
        <div class="cta_banner_actions u-flex-horizontal u-gap-3">
            <a href="/shop" class="c-button">Shop Now</a>
            <a href="/tips" class="c-button-secondary">Dental Tips</a>
        </div>

    </div>
</section>

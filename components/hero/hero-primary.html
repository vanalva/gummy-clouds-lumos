<!-- Component: Hero Primary -->
<!-- Usage: First section inside <main>, homepage only -->
<!-- Theme: Light (default) with pink accent elements -->
<section class="hero_primary u-section u-padding-top-page-top u-padding-bottom-large u-position-relative u-overflow-hidden">
    <div class="u-container">
        <div class="hero_primary_layout u-grid-2 u-gap-8 u-align-items-center">

            <!-- Left: Content -->
            <div class="hero_primary_content u-flex-vertical u-gap-5">
                <!-- Eyebrow badge -->
                <div class="gc-badge u-bg-accent">
                    <span class="c-paragraph u-text-style-small gc-badge_text">Tiny habits, big smiles</span>
                </div>

                <h1 class="c-heading c-heading-display" data-style="h1">Making brushing<br>a happy habit</h1>

                <p class="c-paragraph u-text-style-large hero_primary_description">Fun, gentle dental care products designed to help kids build healthy habits they'll love — from the very first tooth.</p>

                <!-- Buttons -->
                <div class="hero_primary_actions u-flex-horizontal u-gap-3">
                    <a href="/shop" class="c-button">Shop Now</a>
                    <a href="/about" class="c-button-secondary">Our Story</a>
                </div>
            </div>

            <!-- Right: Image -->
            <div class="hero_primary_media u-position-relative">
                <div class="hero_primary_image_wrap gc-cloud-card u-overflow-hidden u-flex-vertical u-align-items-center u-justify-center" style="background-color: var(--swatch--light-200)">
                    <img src="../assets/illust-hero-tooth.svg" alt="Happy hero tooth character with cape and shield" class="c-image c-image-contain" loading="eager" width="300" height="300">
                </div>
                <!-- Floating decorative accent -->
                <div class="hero_float_badge u-bg-secondary u-position-absolute u-flex-horizontal u-gap-2 u-align-items-center">
                    <img src="../assets/illust-medal.svg" alt="" class="hero_float_badge_icon" aria-hidden="true">
                    <span class="hero_float_badge_text">Dentist approved</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Background decorative cloud shapes (CSS-only via pseudo-elements in embed) -->
</section>

<!-- Component: Hero Simple -->
<!-- Usage: First section inside <main>, for subpages (About, Products, Contact, etc.) -->
<!-- Theme: Clouds (warm neutral background) -->
<section class="hero_simple u-section u-padding-top-page-top u-padding-bottom-small u-theme-clouds">
    <div class="u-container u-flex-vertical u-gap-3 u-align-items-center u-text-align-center">
        <!-- Breadcrumb -->
        <nav class="hero_breadcrumb u-flex-horizontal u-gap-1" aria-label="Breadcrumb">
            <a href="/" class="c-paragraph u-text-style-small hero_breadcrumb_link">Home</a>
            <span class="c-paragraph u-text-style-small hero_breadcrumb_sep" aria-hidden="true">/</span>
            <span class="c-paragraph u-text-style-small hero_breadcrumb_current" aria-current="page">Page Name</span>
        </nav>

        <!-- Page Title -->
        <h1 class="c-heading c-heading-display" data-style="h2">Page Title</h1>

        <!-- Optional subtitle -->
        <p class="c-paragraph u-text-style-large hero_simple_subtitle">A brief description of what this page is about.</p>
    </div>
</section>

<!-- ════════════════════════════════════════════════════════════════════════
     Component: Newsletter Signup Section
     Usage: Add before CTA or footer sections for email capture
     ════════════════════════════════════════════════════════════════════════ -->
<section class="u-section u-padding-top-main u-padding-bottom-main u-theme-clouds">
    <div class="u-container u-flex-vertical u-gap-5 u-align-items-center u-text-align-center">
        <h2 class="c-heading c-heading-display" data-style="h3">Get dental tips in your
            <span class="gc-badge-inline gc-badge-inline--brand">inbox</span>
        </h2>
        <p class="c-paragraph u-text-style-main newsletter_subtitle">Join thousands of parents who get weekly tips on making dental care fun and effective.</p>
        <div class="newsletter_form u-flex-horizontal u-gap-2">
            <input type="email" class="newsletter_input" placeholder="Enter your email" aria-label="Email address">
            <a href="#" class="c-button-accent">Subscribe</a>
        </div>
        <p class="c-paragraph u-text-style-small newsletter_note">We respect your privacy. Unsubscribe anytime.</p>
    </div>
</section>
